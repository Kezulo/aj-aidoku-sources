name: Publish Aidoku source list

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "build-list.sh"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Aidoku CLI
        run: cargo install --git https://github.com/Aidoku/aidoku-rs aidoku-cli

      - name: Verify source packages
        run: aidoku verify packages/*.aix

      - name: Build source list
        run: sh build-list.sh

      - name: Publish to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          single-commit: true
